<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квазар Жерді алыстан өлтіреді</title>
<style>
:root{--bg:#000;--fg:#efe6d6;--dim:#a99d88;--card:rgba(10,8,6,.58);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#efe6d6;--dim:#a99d88;--card:rgba(10,8,6,.58)}}
:root[data-theme="dark"]{--bg:#000;--fg:#efe6d6;--dim:#a99d88;--card:rgba(10,8,6,.58)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
.top{top:calc(env(safe-area-inset-top,0px) + 10px);align-items:flex-start}
.bot{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.box{background:var(--card);backdrop-filter:blur(6px);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.45}
.dim{color:var(--dim);font-size:12px}
label{display:block;font-size:12px;color:var(--dim);margin-top:6px}
.btns{display:flex;gap:6px}
button{pointer-events:auto;background:var(--card);color:var(--fg);border:1px solid #6b5d46;border-radius:10px;padding:10px 14px;font-size:15px;backdrop-filter:blur(6px)}
input[type=range]{pointer-events:auto;width:100%;margin:2px 0 0;accent-color:#e08a3c}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud top"><div class="box"><b>Квазар Жерді алыстан өлтіреді</b><br><span class="dim">Сәуле ағыны · сүйреп айналдырыңыз · сол жақта — квазар, оңда — Жер</span></div></div>
<div class="hud bot"><div class="box" style="flex:1">
<div id="ro" class="dim"></div><div id="st" style="margin-top:4px"></div>
<label>Квазардан қашықтық: <span id="dv"></span></label><input id="ds" type="range" min="-0.7" max="2" step="0.01" value="0">
<label>Камера: квазар ↔ Жер</label><input id="zs" type="range" min="0" max="1" step="0.01" value="0.3">
<label>Үдетілген уақыт</label><input id="sl" type="range" min="0" max="24" step="0.01" value="0">
</div><div class="btns"><button id="pp">⏸</button><button id="rp">↻</button></div></div>
<div id="err"></div>
<script>
const TMAX=24;
const VS=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS=`precision highp float;
uniform vec2 uRes;uniform float uT,uO,uA,uM,uVeil;
uniform vec3 uCam,uF,uR,uU;
const float PI=3.14159265,BETA=.95,GAM=3.202563;
const vec3 Q=vec3(-18.,0.,0.);const float QS=.3;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float ss(float a,float b,float x){float t=clamp((x-a)/(b-a),0.,1.);return t*t*(3.-2.*t);}
float blob(vec3 o,vec3 d,vec3 c,float s){float b=length(cross(c-o,d));return exp(-b*b/(2.*s*s))*2.5066*s;}
float dop(float cs){return 1./(GAM*(1.-BETA*cs));}
vec3 stars(vec3 d){
  vec2 c=floor(vec2((atan(d.z,d.x)+PI)/(2.*PI)*1800.,acos(clamp(d.y,-1.,1.))/PI*900.));
  float r=hash(c);float b=pow(clamp((r-.995)/.005,0.,1.),3.)*1.3;
  float t=hash(c+7.3);return b*vec3(.8+.2*t,.85,1.1-.4*t);}
vec3 earthTex(vec3 q){
  float x=q.x,y=q.y,z=q.z;
  float ln=sin(3.1*x+1.3)*sin(2.7*y+.5)*sin(3.7*z+2.1)+.6*sin(5.3*x+2.*z)*sin(4.1*y+1.5*x)+.35*sin(9.1*z+3.*y+1.)*sin(8.3*x-2.*y);
  float land=ss(.1,.2,ln);float dry=ss(-.3,.5,sin(7.*x+3.*z)*sin(5.*y));
  vec3 sea=mix(vec3(.03,.15,.55),vec3(.22,.16,.11),uO);
  vec3 b=mix(sea,mix(vec3(.12,.42,.12),vec3(.5,.38,.18),dry),land);
  b=mix(b,vec3(.35,.28,.2),uO*land*.7);
  b=mix(b,mix(vec3(1.),vec3(.35,.28,.2),uO),ss(.82,.9,abs(y)));
  float cl=.5+.5*(sin(6.*x+2.*y)*sin(5.*z-3.*y)+.5*sin(11.*y+3.*x));
  float ca=ss(.55-.25*uO,.9,cl)*(1.-uA)*(.8+.2*uO);
  return mix(b,vec3(1.),ca);}
float crack(vec3 p){
  float n1=sin(9.*p.x+2.*sin(7.*p.y+3.*p.z));
  float n2=sin(8.*p.y+2.*sin(6.*p.z+4.*p.x));
  float n3=sin(10.*p.z+2.*sin(5.*p.x+3.*p.y));
  return 1.-smoothstep(0.,.18,min(abs(n1),min(abs(n2),abs(n3))));}
void main(){
  float asp=uRes.x/uRes.y;float th=.65*max(1.,1.1/asp);
  vec2 uv=(gl_FragCoord.xy*2.-uRes)/uRes.y;
  vec3 d=normalize(uF+uv.x*th*uR+uv.y*th*uU);vec3 o=uCam;
  vec3 dq=normalize(vec3(-1.,.08,-.05));
  vec3 col=stars(d)*.8;
  // квазардың өзі: соқыр ядро, дифракция сәулелері, диск, джеттер, иесі галактика
  {
    vec3 oq=(o-Q)/QS;vec3 relq=Q-o;float zq=dot(relq,uF);
    vec2 uq=vec2(dot(relq,uR),dot(relq,uU))/max(zq,.001)/th;float inv=step(0.,zq);
    vec3 qc=vec3(0.);float b0=length(cross(oq,d));
    qc+=vec3(.75,.88,1.)*(3.*exp(-b0*b0/.5)+1.4/(1.+b0*b0/3.)+.6/(1.+b0*b0/40.));
    if(abs(d.y)>1e-4){float t=-oq.y/d.y;if(t>0.){vec3 pc=oq+d*t;float rc=length(pc.xz);
      if(rc>.8&&rc<4.5){vec3 tg=vec3(-pc.z,0.,pc.x)/rc;float bt=.55/sqrt(rc);
        float D=1./(inversesqrt(1.-bt*bt)*(1.-bt*dot(tg,-d)));
        vec3 dc=mix(vec3(.8,.9,1.),vec3(1.,.55,.2),ss(.8,4.5,rc));
        qc+=dc*pow(D,3.)*1.6/pow(rc,1.1)*ss(.8,1.2,rc)*ss(4.5,3.8,rc);}}}
    vec2 u2=uv-uq;float rp=length(u2);
    float psf=.9/(1.+pow(rp/.02,2.))+.12/(1.+pow(rp/.1,2.));
    vec2 sp=vec2(u2.x+u2.y,u2.x-u2.y)*.7071;
    float spk=(exp(-abs(sp.x)*60.)*exp(-abs(sp.y)*3.)+exp(-abs(sp.y)*60.)*exp(-abs(sp.x)*3.))*.8;
    qc+=vec3(.8,.9,1.)*(psf+spk)*inv;
    vec2 oxz=oq.xz,dxz=d.xz;float a=dot(dxz,dxz);
    if(a>1e-3){
      float ts=-dot(oxz,dxz)/a;vec2 cx=oxz+ts*dxz;float rho2=dot(cx,cx);
      float s=oq.y+ts*d.y;float ay=abs(s);float w=.5+.07*ay;
      float jd=exp(-rho2/(2.*w*w))/(1.+.06*ay)*smoothstep(1.5,3.5,ay)*smoothstep(64.,58.,ay);
      float len=2.5066*w/sqrt(a);float D=dop(dot(vec3(0.,sign(s),0.),-d));
      float kn=.4+.6*pow(.5+.5*sin(1.2*ay-6.*uT),2.);
      qc+=vec3(.4,.6,1.)*jd*kn*len*1.1*pow(D,1.8);}
    for(int k=0;k<2;k++){
      float sg=k==0?1.:-1.;vec3 c=vec3(0.,sg*62.,0.);float Dk=dop(sg*(-d.y));
      qc+=vec3(.85,.92,1.)*blob(oq,d,c,1.4)*pow(Dk,1.8)*.5;
      qc+=vec3(.5,.22,.8)*blob(oq,d,c,9.)*pow(Dk,1.2)*.04;}
    qc+=vec3(1.,.82,.58)*exp(-b0*b0/(2.*22.*22.))*55.*.006;
    col+=qc;
  }
  // Жер
  float bb=dot(o,d);float disc=bb*bb-(dot(o,o)-1.);
  float thit=1e9;
  if(disc>0.){
    float t=-bb-sqrt(disc);thit=t;vec3 pos=o+d*t;vec3 n=pos;
    float cs=cos(uT*.12),sn=sin(uT*.12);vec3 q=vec3(n.x*cs-n.z*sn,n.y,n.x*sn+n.z*cs);
    float lam=max(dot(n,dq),0.);
    vec3 c=earthTex(q)*(.03+1.4*lam)*2.;
    float rim=pow(1.-clamp(dot(n,-d),0.,1.),3.);
    vec3 atm=mix(vec3(.3,.55,1.),vec3(1.,.7,.4),max(uO,uM)*.7);
    c+=atm*rim*(.15+lam)*(1.-uA)*1.6;
    float hl=uM*(.4+.6*ss(-.2,.8,lam));
    c=mix(c,vec3(.05,.035,.03),ss(.1,.5,hl));
    c+=vec3(1.,.4,.08)*(crack(q)*hl*2.2+ss(.55,1.,hl)*(.7+.6*sin(8.*q.x+uT*2.)*sin(7.*q.y)));
    c+=vec3(1.,.5,.2)*ss(.5,1.,lam)*uM*.4;
    col=c;
  }else{
    float bq=length(cross(o,d));
    if(bq>1.){vec3 nl=normalize(o+d*(-bb));
      col+=mix(vec3(.3,.55,1.),vec3(1.,.7,.4),max(uO,uM)*.7)*exp(-(bq-1.)*14.)*(1.-uA)*(.2+max(dot(nl,dq),0.))*.9;}}
  // буланған заттың құйрығы (квазардан қарама-қарсы, +x)
  vec2 oy=o.yz,dy=d.yz;float a=dot(dy,dy);
  if(a>1e-3&&uA>.01){
    float ts=-dot(oy,dy)/a;vec2 cx=oy+ts*dy;float rho2=dot(cx,cx);float s=o.x+ts*d.x;
    if(s>0.&&!(thit<1e8&&ts>thit)){
      float Lt=1.5+8.*uA;float w=.55+.3*s;
      float dens=exp(-rho2/(2.*w*w))*smoothstep(Lt,Lt*.5,s)*smoothstep(.2,1.2,s)/(1.+.4*s);
      float len=2.5066*w/sqrt(a);float tur=.7+.3*sin(2.5*s-uT*3.);
      vec3 tc=mix(vec3(.75,.85,1.),vec3(1.,.65,.3),uM);
      col+=tc*dens*len*uA*1.4*tur;}}
  col=1.-exp(-.9*col);
  gl_FragColor=vec4(pow(col,vec3(1./2.2)),1.);}`;
const cv=document.getElementById('c');
const gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
function fail(m){const e=document.getElementById('err');e.style.display='flex';e.textContent=m}
if(!gl)fail('WebGL қолдауы жоқ — басқа браузермен ашып көріңіз.');
else{
const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
  if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))fail(gl.getShaderInfoLog(o));return o};
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['uRes','uT','uO','uA','uM','uVeil','uCam','uF','uR','uU'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
function resize(){const s=Math.min(window.devicePixelRatio||1,1.5);let w=innerWidth*s,h=innerHeight*s;
  const k=Math.min(1,Math.sqrt(800000/(w*h)));cv.width=Math.max(2,w*k|0);cv.height=Math.max(2,h*k|0);gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',resize);resize();
let th=88*Math.PI/180,ph=.15,drag=null,T=0,playing=true;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('pointermove',e=>{if(!drag)return;
  ph=Math.max(-.9,Math.min(.9,ph+(e.clientX-drag[0])*.005));th=Math.max(1.0,Math.min(2.1,th+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY]});
const sl=document.getElementById('sl'),pp=document.getElementById('pp'),ds=document.getElementById('ds'),zs=document.getElementById('zs');
sl.oninput=()=>{T=+sl.value;playing=false;pp.textContent='▶'};
pp.onclick=()=>{if(T>=TMAX)T=0;playing=!playing;pp.textContent=playing?'⏸':'▶'};
document.getElementById('rp').onclick=()=>{T=0;playing=true;pp.textContent='⏸'};
const nrm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)};
const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const sst=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
const L=1e40,LY=9.461e15,SOL=1361;  // квазар жарқырауы ~1e40 Вт (орташа квазар)
const ro=document.getElementById('ro'),st=document.getElementById('st'),dv=document.getElementById('dv');
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(playing){T=Math.min(TMAX,T+dt);sl.value=T;if(T>=TMAX){playing=false;pp.textContent='▶'}}
  if(!drag)ph+=0;
  const ly=Math.pow(10,+ds.value),F=L/(4*Math.PI*Math.pow(ly*LY,2))/SOL,Teq=255*Math.pow(F,.25);
  const p=T/TMAX;
  const O=sst(300,500,Teq)*sst(.05,.5,p),A=sst(500,1200,Teq)*sst(.15,.8,p),M=sst(1200,2000,Teq)*sst(.4,.95,p);
  const veil=.5+1.5*Math.max(0,Math.min(1,(Math.log10(F)-1)/3.5));
  const zz=+zs.value,tc=[-9*(1-zz),0,0],dist=6.5+17.5*(1-zz);
  const dir=[Math.sin(th)*Math.sin(ph),Math.cos(th),-Math.sin(th)*Math.cos(ph)];
  const cam=[tc[0]+dist*dir[0],tc[1]+dist*dir[1],tc[2]+dist*dir[2]];
  const f=nrm(dir.map(x=>-x)),R=nrm(crs(f,[0,1,0])),Uu=crs(R,f);
  gl.uniform2f(U.uRes,cv.width,cv.height);gl.uniform1f(U.uT,T);
  gl.uniform1f(U.uO,O);gl.uniform1f(U.uA,A);gl.uniform1f(U.uM,M);gl.uniform1f(U.uVeil,veil);
  gl.uniform3fv(U.uCam,cam);gl.uniform3fv(U.uF,f);gl.uniform3fv(U.uR,R);gl.uniform3fv(U.uU,Uu);
  gl.drawArrays(gl.TRIANGLES,0,3);
  dv.textContent=(ly<10?ly.toFixed(2):ly.toFixed(0))+' жарық жылы';
  ro.textContent=`жарық ағыны ×${F>=100?F.toExponential(1):F.toFixed(1)} Күн · тепе-теңдік T ≈ ${Teq.toFixed(0)} K`;
  st.textContent=Teq<300?'Алыс: Жерге қауіп аз, тек жарық ағыны күшейген.':Teq<500?'Мұхиттар ыстық, буланып жатыр — тіршілікке төзімсіз.':Teq<1200?(A>.3?'Мұхиттар қайнап біткен, атмосфера ұшып жатыр: Жер қарайған тас.':'Мұхиттар қайнап, бу көтеріліп жатыр…'):(M>.3?'Қыртыс балқып, Жер буланып, құйрық болып сөніп жатыр.':A>.2?'Атмосфера сәулеленуден ұшып кетіп жатыр…':'Мұхиттар қайнап жатыр…');
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
}
</script>
</body>
  </html>
